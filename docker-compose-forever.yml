services:
  mc-forever:
    image: itzg/minecraft-server:latest
    container_name: mc-forever
    ports:
      - "25565:25565"
      - "8123:8123"
      - "24455:24455/udp"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.11"
      ENABLE_RECON: "true"
      RCON_PASSWORD: "test"
      MEMORY: "8192M"
      MOTD: "Meteor Shower - Vanilla"
      USE_AIKAR_FLAGS: "true"
      USE_MEOWICE_FLAGS: "true"
      TZ: "UTC"
      DIFFICULTY: "3"
      ENABLE_COMMAND_BLOCK: "true"
      VIEW_DISTANCE: "16"
      SPAWN_PROTECTION: "0"
      ENABLE_WHITELIST: "true"
      WHITELIST: |-
        Mindstormman
        Liam73995
        GeeseMooseMeese
        Waven06
        0_Aster_0
      ALLOW_FLIGHT: "true"
    volumes:
      - "./data:/data"
    restart: unless-stopped

  statcrafter:
    image: python:3.12-slim
    container_name: forever_statcrafter
    ports:
        - "5000:5000"
    volumes:
        - "./data:/data"
    working_dir: /data
    command: >
        bash -c "
        set -e &&

        echo 'Installing system deps...' &&
        apt-get update &&
        apt-get install -y git &&

        cd /data &&

        if [ ! -d MeteorShowerStats ]; then
            echo 'Cloning StatCrafter...' &&
            git clone https://github.com/Mindstormman06/MeteorShowerStats.git;
        else
            echo 'StatCrafter already exists';
        fi &&

        cd MeteorShowerStats &&

        python -m venv .venv &&
        . .venv/bin/activate &&

        pip install --upgrade pip &&
        pip install -r requirements.txt &&

        mkdir -p /data/output_data &&

        echo 'Starting StatCrafter...' &&
        python app.py
        "
    restart: unless-stopped
